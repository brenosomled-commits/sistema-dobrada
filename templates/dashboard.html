<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Dashboard - Ordem de Serviço</title>

<style>

body {
    font-family: Arial, sans-serif;
    background: #f2f2f2;
    margin: 0;
    padding: 20px;
}

.container {
    max-width: 1100px;
    margin: auto;
}

.logo {
    display: block;
    max-width: 250px;
    max-height: 100px;
    margin: 0 auto 15px;
    object-fit: contain;
}

h1 {
    text-align: center;
}

.menu {
    display: flex;
    justify-content: center;
    gap: 10px;
    margin-bottom: 30px;
    flex-wrap: wrap;
}

button {
    padding: 12px 20px;
    border: none;
    border-radius: 6px;
    cursor: pointer;
    font-size: 15px;
}

.cards {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 20px;
    margin-bottom: 30px;
}

.card {
    background: white;
    padding: 25px;
    border-radius: 10px;
    text-align: center;
}

.card h3 {
    margin-top: 0;
}

.numero {
    font-size: 40px;
    font-weight: bold;
}

.andamento {
    border-bottom: 6px solid #f0ad00;
}

.pronta {
    border-bottom: 6px solid #007bff;
}

.finalizada {
    border-bottom: 6px solid #28a745;
}

.total {
    border-bottom: 6px solid #555;
}

.painel {
    background: white;
    padding: 25px;
    border-radius: 10px;
}

.ordem {
    display: grid;
    grid-template-columns: 100px 1fr 180px 140px;
    gap: 15px;
    padding: 15px;
    border-bottom: 1px solid #ddd;
    align-items: center;
}

.status {
    padding: 7px 12px;
    border-radius: 20px;
    color: white;
    text-align: center;
    font-weight: bold;
}

.status-andamento {
    background: #f0ad00;
}

.status-pronta {
    background: #007bff;
}

.status-finalizada {
    background: #28a745;
}

@media (max-width: 700px) {

    .cards {
        grid-template-columns: repeat(2, 1fr);
    }

    .ordem {
        grid-template-columns: 1fr;
        gap: 5px;
    }

}

</style>
</head>

<body>

<div class="container">

<img
src="{{ url_for('static', filename='logo.png') }}"
class="logo">

<h1>DASHBOARD</h1>

<div class="menu">

<button onclick="window.location.href='/'">
INÍCIO
</button>

<button onclick="window.location.href='/'">
NOVA OS
</button>

<button onclick="window.location.href='/nota_dobrada'">
 NOVA VENDA
</button>

<button onclick="window.location.href='/acompanhamento_notas'">
 ACOMPANHAR NOTAS
</button>

<button onclick="window.location.href='/?consulta=1'">
CONSULTAR OS
</button>

<button onclick="location.reload()">
ATUALIZAR
</button>

</div>


<div class="cards">

<div class="card total">
<h3>TOTAL DE OS</h3>
<div class="numero" id="totalOS">0</div>
</div>

<div class="card andamento">
<h3>EM ANDAMENTO</h3>
<div class="numero" id="andamentoOS">0</div>
</div>

<div class="card pronta">
<h3>PRONTAS</h3>
<div class="numero" id="prontaOS">0</div>
</div>

<div class="card finalizada">
<h3>FINALIZADAS</h3>
<div class="numero" id="finalizadaOS">0</div>
</div>

</div>


<div class="painel">

<h2>ÚLTIMAS ORDENS DE SERVIÇO</h2>

<div id="ultimasOrdens">

Carregando...

</div>

</div>

</div>


<script>

function classeStatus(status) {

    if (status === "Em andamento")
        return "status-andamento";

    if (status === "Pronta")
        return "status-pronta";

    if (status === "Finalizada")
        return "status-finalizada";

    return "";

}


async function carregarDashboard() {

    const resposta = await fetch("/ordens");

    const ordens = await resposta.json();


    document.getElementById("totalOS").innerText =
        ordens.length;


    document.getElementById("andamentoOS").innerText =
        ordens.filter(
            ordem => ordem.status === "Em andamento"
        ).length;


    document.getElementById("prontaOS").innerText =
        ordens.filter(
            ordem => ordem.status === "Pronta"
        ).length;


    document.getElementById("finalizadaOS").innerText =
        ordens.filter(
            ordem => ordem.status === "Finalizada"
        ).length;


    const lista =
        document.getElementById("ultimasOrdens");

    lista.innerHTML = "";


    const ultimas =
        ordens.slice(0, 10);


    ultimas.forEach(function(ordem) {

        const div =
            document.createElement("div");

        div.className = "ordem";

        div.innerHTML = `
            <b>OS #${String(ordem.numero).padStart(5, "0")}</b>

            <span>${ordem.cliente || "-"}</span>

            <span>${ordem.data_entrada}</span>

            <span class="status ${classeStatus(ordem.status)}">
                ${ordem.status}
            </span>
        `;

        lista.appendChild(div);

    });

}


carregarDashboard();

</script>

</body>
</html>
