<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#123a7a">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Rastreamento de Entrega</title>
<style>
:root{
  --cor-primaria:#123a7a;
  --cor-secundaria:#0ea5e9;
  --cor-fundo:#f1f5f9;
  --cor-painel:#ffffff;
  --cor-borda:#e2e8f0;
  --cor-texto:#0f172a;
  --cor-texto-sec:#475569;
  --sombra:0 8px 24px rgba(15,23,42,.08);
}
*{ box-sizing:border-box; }
html,body{ margin:0; padding:0; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; background:var(--cor-fundo); color:var(--cor-texto); -webkit-text-size-adjust:100%; }
.wrap{ max-width:560px; margin:0 auto; padding:16px 16px calc(24px + env(safe-area-inset-bottom)); }
.card{ background:var(--cor-painel); border:1px solid var(--cor-borda); border-radius:16px; box-shadow:var(--sombra); overflow:hidden; margin-bottom:14px; }
.hero{ background:linear-gradient(135deg,#0f172a 0%, #1e3a5f 60%, #0ea5e9 100%); color:#fff; padding:22px 20px; }
.hero h1{ margin:0 0 6px 0; font-size:1.35rem; font-weight:800; letter-spacing:.02em; }
.hero p{ margin:0; opacity:.85; font-size:.85rem; }
.numero{ display:inline-block; background:rgba(255,255,255,.18); border:1px solid rgba(255,255,255,.3); padding:4px 12px; border-radius:999px; font-size:.78rem; font-weight:700; margin-top:8px; }
.body{ padding:18px 20px; }
.row{ display:flex; justify-content:space-between; gap:12px; padding:8px 0; border-bottom:1px dashed var(--cor-borda); font-size:.92rem; }
.row:last-child{ border-bottom:none; }
.row .k{ color:var(--cor-texto-sec); font-weight:600; }
.row .v{ color:var(--cor-texto); font-weight:600; text-align:right; max-width:60%; word-break:break-word; }
.status{ display:inline-block; padding:6px 14px; border-radius:999px; font-weight:800; font-size:.8rem; letter-spacing:.05em; text-transform:uppercase; }
.badge-Pendente{ background:#fef3c7; color:#92400e; }
.badge-Em\ rota{ background:#dbeafe; color:#1e40af; }
.badge-SAIU\ PARA\ ROTA{ background:#dbeafe; color:#1e40af; border:1px solid #93c5fd; }
.badge-Entregue{ background:#d1fae5; color:#065f46; }
.badge-Falha{ background:#fee2e2; color:#991b1b; }
.badge-Cancelada{ background:#f3f4f6; color:#6b7280; text-decoration:line-through; }
.badge-Reagendada{ background:#ede9fe; color:#6d28d9; }

.timeline{ position:relative; padding-left:24px; }
.timeline::before{ content:""; position:absolute; left:8px; top:6px; bottom:6px; width:2px; background:var(--cor-borda); }
.tl-item{ position:relative; padding:8px 0; }
.tl-item::before{ content:""; position:absolute; left:-22px; top:14px; width:12px; height:12px; border-radius:50%; background:var(--cor-secundaria); box-shadow:0 0 0 3px #fff, 0 0 0 4px var(--cor-secundaria); }
.tl-item.ativo::before{ background:#10b981; box-shadow:0 0 0 3px #fff, 0 0 0 4px #10b981; }
.tl-item.futuro::before{ background:#cbd5e1; box-shadow:0 0 0 3px #fff, 0 0 0 4px #cbd5e1; }
.tl-status{ font-weight:700; font-size:.92rem; }
.tl-data{ font-size:.78rem; color:var(--cor-texto-sec); }

.btn{ display:inline-flex; align-items:center; justify-content:center; gap:8px; width:100%; padding:12px 16px; border-radius:12px; background:var(--cor-primaria); color:#fff; border:none; font-weight:700; font-size:.95rem; text-decoration:none; cursor:pointer; }
.btn:hover{ filter:brightness(1.05); }
.btn.outline{ background:#fff; color:var(--cor-primaria); border:1px solid var(--cor-primaria); }
.mapa-link{ display:block; margin-top:6px; }
.loading{ text-align:center; padding:40px 20px; color:var(--cor-texto-sec); }
.erro{ background:#fee2e2; color:#991b1b; padding:14px; border-radius:12px; text-align:center; font-weight:600; }
.footer{ text-align:center; color:var(--cor-texto-sec); font-size:.78rem; padding:8px 0; }
.pulse{ display:inline-block; width:8px; height:8px; border-radius:50%; background:#10b981; margin-right:6px; animation:pulse 1.6s infinite; }
@keyframes pulse{ 0%{ transform:scale(.8); opacity:.6; } 50%{ transform:scale(1.4); opacity:1; } 100%{ transform:scale(.8); opacity:.6; } }
</style>
</head>
<body>
<div class="wrap">
    <div class="card">
        <div class="hero">
            <h1>🚚 Sua entrega</h1>
            <p>Acompanhe em tempo real pelo QR ou link</p>
            <div id="numero" class="numero">Carregando...</div>
        </div>
        <div class="body" id="conteudo">
            <div class="loading">⏳ Buscando informações...</div>
        </div>
    </div>
    <div class="footer">Atualização automática a cada 20 segundos</div>
</div>
<script>
const STATUS_FLOW = ["Pendente","SAIU PARA ROTA","Em rota","Entregue"];
const TOKEN = "{{ token }}";
let ultimoStatus = null;

async function carregar(){
    const el = document.getElementById("conteudo");
    const elNum = document.getElementById("numero");
    try{
        const r = await fetch(`/api/publico/rastrear/${encodeURIComponent(TOKEN)}`, { cache:"no-store" });
        if(!r.ok){
            el.innerHTML = '<div class="erro">❌ Entrega não encontrada. Verifique o link.</div>';
            elNum.textContent = "—";
            return;
        }
        const d = await r.json();
        elNum.textContent = `#${d.numero || "?"} · ${d.status || ""}`;
        const mudou = ultimoStatus !== d.status;
        ultimoStatus = d.status;
        const cls = (d.status||"").replace(/ /g,"\\ ");
        const vivo = ["Pendente","SAIU PARA ROTA","Em rota"].includes(d.status);
        const mapsLink = (d.latitude && d.longitude)
            ? `https://www.google.com/maps?q=${d.latitude},${d.longitude}`
            : (d.endereco ? `https://www.google.com/maps?q=${encodeURIComponent((d.endereco||"") + ", " + (d.bairro||""))}` : "");
        el.innerHTML = `
            <div style="display:flex;align-items:center;gap:10px;margin-bottom:14px">
                ${vivo?'<span class="pulse"></span>':''}
                <span class="status badge-${cls}">${d.status||"—"}</span>
            </div>
            <div class="row"><span class="k">Cliente</span><span class="v">${escapeHtml(d.cliente||"—")}</span></div>
            <div class="row"><span class="k">Endereço</span><span class="v">${escapeHtml(d.endereco||"—")}</span></div>
            ${d.bairro?`<div class="row"><span class="k">Bairro</span><span class="v">${escapeHtml(d.bairro)}</span></div>`:""}
            ${d.entregador?`<div class="row"><span class="k">Entregador</span><span class="v">${escapeHtml(d.entregador)}</span></div>`:""}
            <div class="row"><span class="k">Previsão</span><span class="v">${escapeHtml(d.previsao || d.horario || d.data_entrega || "—")}</span></div>
            ${d.data_saida?`<div class="row"><span class="k">Saiu para rota</span><span class="v">${escapeHtml(d.data_saida)}</span></div>`:""}
            ${d.data_entregue?`<div class="row"><span class="k">Entregue em</span><span class="v">${escapeHtml(d.data_entregue)}</span></div>`:""}
            <h3 style="margin:18px 0 8px 0;font-size:.95rem">📍 Linha do tempo</h3>
            <div class="timeline" id="timeline"></div>
            ${mapsLink?`<a class="btn mapa-link" href="${mapsLink}" target="_blank" rel="noopener">🗺️ Abrir no mapa</a>`:""}
        `;
        renderTimeline(d);
        if(mudou && vivo){
            try{ vibrate([100,60,100]); }catch(_){}
        }
    }catch(e){
        el.innerHTML = '<div class="erro">⚠️ Falha de conexão. Tentando novamente...</div>';
    }
}

function renderTimeline(d){
    const el = document.getElementById("timeline");
    if(!el) return;
    const histMap = {};
    (d.historico||[]).forEach(h => { histMap[h.status] = h.data_hora; });
    const curIdx = STATUS_FLOW.indexOf(d.status);
    let html = "";
    STATUS_FLOW.forEach((st, i)=>{
        const cls = (i < curIdx) ? "" : (i === curIdx ? "ativo" : "futuro");
        const data = histMap[st] || (i <= curIdx ? "—" : "Pendente");
        const clsBadge = st.replace(/ /g,"\\ ");
        html += `<div class="tl-item ${cls}">
            <div class="tl-status">${st}</div>
            <div class="tl-data">${escapeHtml(data)}</div>
        </div>`;
    });
    // status especiais que não estão no fluxo
    ["Falha","Cancelada","Reagendada"].forEach(st=>{
        if(d.status === st || histMap[st]){
            const cls = (d.status===st) ? "ativo" : "";
            html += `<div class="tl-item ${cls}">
                <div class="tl-status">${st}</div>
                <div class="tl-data">${escapeHtml(histMap[st]||"—")}</div>
            </div>`;
        }
    });
    el.innerHTML = html;
}

function escapeHtml(s){
    return String(s||"").replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]));
}

function vibrate(pattern){ if(navigator.vibrate) navigator.vibrate(pattern); }

carregar();
setInterval(carregar, 20000);
</script>
</body>
</html>
