<!DOCTYPE html>
<html lang="pt-BR">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Login - Sistema OS</title>

<style>

body {
    font-family: Arial, sans-serif;
    background: #f2f2f2;
    margin: 0;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
}

.login {
    background: white;
    width: 350px;
    padding: 35px;
    border-radius: 10px;
    box-sizing: border-box;
    box-shadow: 0 0 15px #ccc;
}

h1 {
    text-align: center;
    margin-bottom: 30px;
}

label {
    display: block;
    margin-top: 15px;
    font-weight: bold;
}

input {
    width: 100%;
    padding: 12px;
    margin-top: 5px;
    box-sizing: border-box;
    border: 1px solid #ccc;
    border-radius: 5px;
    font-size: 16px;
}

button {
    width: 100%;
    margin-top: 25px;
    padding: 13px;
    border: none;
    border-radius: 5px;
    background: #007bff;
    color: white;
    font-size: 16px;
    cursor: pointer;
}

button:hover {
    background: #0056b3;
}

.erro {
    background: #ffe0e0;
    color: #b00000;
    padding: 10px;
    margin-bottom: 15px;
    border-radius: 5px;
    text-align: center;
}

</style>
</head>

<body>

<div class="login">

<h1>SISTEMA DE OS</h1>

{% if erro %}
<div class="erro">
    {{ erro }}
</div>
{% endif %}

<form method="POST">

<label>Usuário</label>

<input
type="text"
name="usuario"
placeholder="Digite seu usuário"
required
autocomplete="username">

<label>Senha</label>

<input
type="password"
name="senha"
placeholder="Digite sua senha"
required
autocomplete="current-password">

<button type="submit">
ENTRAR
</button>

</form>

</div>

</body>
</html>
